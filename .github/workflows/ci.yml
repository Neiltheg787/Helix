name: Helix CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Jac
        run: curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash -s -- --version 0.34.7
      - name: Validate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          jac install
          jac check .
          jac build
      - name: Build Next UI
        run: |
          npm ci
          npm run build
