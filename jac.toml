[project]
name = "helix"
version = "1.0.0"
description = "Helix native Jac hardware engineering workspace"
entry-point = "main.jac"

[dependencies]
byllm = ">=0.1.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
zod = "^4.3.6"
three = "^0.183.2"
lucide-react = "^0.469.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"
host = "0.0.0.0"
port = 8000
on_conflict = "retry"
conflict_max_attempts = 5

[client.app_meta_data]
title = "Helix"
description = "AI-native hardware engineering in native Jac"
theme_color = "#0f3f2e"

[client]

[byllm.model]
default_model = "gpt-4o-mini"

[test]
directory = "."
